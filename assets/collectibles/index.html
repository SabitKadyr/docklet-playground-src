<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Collectibles — The Field</title>
<script>
// Phones that land here get the app itself, full screen, not a phone inside a phone.
if (matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 600) location.replace('app.html' + location.search);
</script>
<style>
/* Desktop showcase: the app at iPhone 16 Pro size (402 x 874 pt, 62 pt top / 34 pt bottom safe areas).
   Screen and ink colors mirror the app's --bg and --fg so the safe-area strips blend in. */
:root{
  --page:#E6E6EA;--page-glow:#F7F7F9;
  --screen:#F7F7F8;--ink:#0B0C0F;
}
@media (prefers-color-scheme:dark){:root{
  --page:#040405;--page-glow:#17181C;
  --screen:#0B0C0F;--ink:#F4F4F5;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;overflow:hidden;background:var(--page) radial-gradient(ellipse 55% 65% at 50% 45%,var(--page-glow),var(--page))}
.stage{width:calc(430px * var(--s,1));height:calc(902px * var(--s,1))}
.device{position:relative;width:430px;height:902px;border-radius:72px;transform:scale(var(--s,1));transform-origin:0 0;
  background:linear-gradient(150deg,#6a6b70 0%,#2b2c30 22%,#4b4c51 48%,#232428 74%,#5a5b60 100%);
  box-shadow:0 0 0 1px rgba(0,0,0,.3),0 50px 90px -30px rgba(0,0,0,.5),0 24px 40px -18px rgba(0,0,0,.35)}
.btn{position:absolute;width:4px;background:linear-gradient(90deg,#26272b,#5d5e63 50%,#26272b)}
.btn.l{left:-3px;border-radius:2px 0 0 2px}
.btn.r{right:-3px;border-radius:0 2px 2px 0}
.bezel{position:absolute;inset:3px;border-radius:69px;background:#040405;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.screen{position:absolute;inset:14px;border-radius:58px;overflow:hidden;background:var(--screen);color:var(--ink);isolation:isolate}
.screen iframe{position:absolute;left:0;top:62px;width:402px;height:778px;border:0;display:block;background:var(--screen)}
.island{position:absolute;left:50%;top:11px;width:126px;height:37px;margin-left:-63px;border-radius:19px;background:#000}
.status{position:absolute;left:0;right:0;top:11px;height:37px;display:flex;align-items:center;justify-content:space-between;
  font:600 17px/1 -apple-system,"SF Pro Text",Inter,system-ui,sans-serif;letter-spacing:-.3px;pointer-events:none;user-select:none}
.status .time{width:138px;padding-left:16px;text-align:center}
.status .icons{width:138px;padding-right:12px;display:flex;align-items:center;justify-content:center;gap:6px}
.home{position:absolute;left:50%;bottom:8px;width:138px;height:5px;margin-left:-69px;border-radius:3px;background:var(--ink)}
</style>
</head>
<body>
<div class="stage">
  <div class="device">
    <i class="btn l" style="top:150px;height:34px" aria-hidden="true"></i>
    <i class="btn l" style="top:214px;height:64px" aria-hidden="true"></i>
    <i class="btn l" style="top:292px;height:64px" aria-hidden="true"></i>
    <i class="btn r" style="top:244px;height:100px" aria-hidden="true"></i>
    <i class="btn r" style="top:560px;height:58px" aria-hidden="true"></i>
    <div class="bezel"></div>
    <div class="screen">
      <div class="status" aria-hidden="true">
        <span class="time">9:41</span>
        <span class="icons">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect y="7.5" width="3" height="4.5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" width="3" height="12" rx="1"/></svg>
          <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor"><path d="M2.75 4.81a8.6 8.6 0 0 1 11.5 0" stroke-width="2.4"/><path d="M4.95 7.26a5.3 5.3 0 0 1 7.1 0" stroke-width="2.4"/><path d="M7.43 10.01a1.6 1.6 0 0 1 2.14 0" stroke-width="3.2"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" stroke-opacity=".35"/><rect x="2" y="2" width="20" height="9" rx="2.4" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2z" fill="currentColor" fill-opacity=".4"/></svg>
        </span>
      </div>
      <div class="island" aria-hidden="true"></div>
      <iframe id="app" src="app.html" title="Collectibles"></iframe>
      <div class="home" aria-hidden="true"></div>
    </div>
  </div>
</div>
<script>
(function () {
  var root = document.documentElement;
  function fit() {
    var pad = Math.max(20, innerHeight * 0.04);
    var s = Math.min(1, (innerHeight - pad * 2) / 902, (innerWidth - pad * 2) / 430);
    root.style.setProperty('--s', Math.max(0.3, s).toFixed(4));
  }
  fit();
  addEventListener('resize', fit);
  // Hand keyboard focus to the app so its shortcuts (arrows, +, -, 0) work straight away.
  var app = document.getElementById('app');
  // Pass the page's query (like ?new) through to the app.
  if (location.search) app.src = 'app.html' + location.search;
  app.addEventListener('load', function () { try { app.contentWindow.focus(); } catch (e) {} });
})();
</script>
</body>
</html>
